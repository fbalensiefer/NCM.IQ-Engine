name: NCM.IQ CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: .libtorch
          key: libtorch-2.13.0-${{ runner.os }}-${{ runner.arch }}
      - name: Set up LibTorch
        run: |
          sdk=$(bash scripts/libtorch.sh)
          echo "LIBTORCH=$sdk" >> "$GITHUB_ENV"
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99.1 test --locked
