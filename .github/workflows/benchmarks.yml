name: Checkpoint benchmarks
on:
  workflow_dispatch:
    inputs:
      device:
        description: Backend. MPS requires a self-hosted Apple Silicon runner.
        type: choice
        options: [cpu, mps]
        default: cpu
      runs:
        description: Requests per profile after warm-up
        type: number
        default: 12

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.device == 'mps' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      NCM_DEVICE: ${{ inputs.device }}
      NCM_RUNS: ${{ inputs.runs }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,download]'
      - run: ncm-download
      - name: Verify official checkpoints offline
        env:
          HF_HUB_OFFLINE: '1'
          NCM_TEST_ARTIFACTS: artifacts
        run: python -m pytest -q -m model
      - name: Measure the three profiles in separate processes
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          for profile in quality balanced ultra; do
            ncm-benchmark --device "$NCM_DEVICE" --profile "$profile" --runs "$NCM_RUNS" --output "results/$profile.json"
          done
          python -m benchmarks.compare results/quality.json results/balanced.json
          python -m benchmarks.compare results/quality.json results/ultra.json
      - uses: actions/upload-artifact@v4
        with:
          name: ncm-benchmark-${{ inputs.device }}
          path: results
