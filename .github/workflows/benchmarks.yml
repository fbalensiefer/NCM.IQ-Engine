name: NCM.IQ checkpoint benchmarks
on:
  workflow_dispatch:
    inputs:
      device:
        description: Backend. MPS requires a self-hosted Apple Silicon runner.
        type: choice
        options: [cpu, mps]
        default: cpu
      runs:
        description: Requests per profile after warm-up
        type: number
        default: 12

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.device == 'mps' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      NCM_DEVICE: ${{ inputs.device }}
      NCM_RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: .libtorch
          key: libtorch-2.13.0-${{ runner.os }}-${{ runner.arch }}
      - name: Set up LibTorch
        run: |
          sdk=$(bash scripts/libtorch.sh)
          echo "LIBTORCH=$sdk" >> "$GITHUB_ENV"
      - run: cargo +1.99.1 build --release --locked
      - run: target/release/ncm-iq download
      - run: cargo +1.99.1 test --release --locked --test official -- --ignored
      - name: Measure three profiles
        run: |
          for profile in quality balanced ultra; do
            target/release/ncm-iq benchmark --backend "$NCM_DEVICE" --profile "$profile" --runs "$NCM_RUNS" --output "results/$profile.json"
          done
          target/release/ncm-iq compare results/quality.json results/balanced.json
          target/release/ncm-iq compare results/quality.json results/ultra.json
      - uses: actions/upload-artifact@v4
        with:
          name: ncm-iq-benchmark-${{ inputs.device }}
          path: results
