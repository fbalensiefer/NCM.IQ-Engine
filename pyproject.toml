[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ncm-chat"
version = "0.1.0"
description = "Local Next-Concept Modeling inference and dialogue adaptation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
    "torch>=2.8,<3",
    "numpy>=1.26,<3",
    "transformers>=4.51,<5",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psutil>=6,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
download = ["huggingface-hub>=0.31,<1"]

[project.scripts]
ncm-chat = "backend.api:main"
ncm-benchmark = "benchmarks.run:main"
ncm-download = "scripts.download:main"
ncm-train = "training.finetune:main"

[tool.hatch.build.targets.wheel]
packages = ["ncm_engine", "optimization", "backend", "frontend", "benchmarks", "scripts", "training"]

[tool.ruff]
extend-exclude = ["ncm_engine/_upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: official checkpoint integration test"]
